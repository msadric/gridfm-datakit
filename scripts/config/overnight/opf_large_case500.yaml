network:
  name: case500_goc
  source: pglib
  network_dir: scripts/grids
load:
  generator: agg_load_profile
  agg_profile: default
  scenarios: 150
  sigma: 0.2
  change_reactive_power: true
  global_range: 0.4
  max_scaling_factor: 4.0
  step_size: 0.1
  start_scaling_factor: 1.0
topology_perturbation:
  type: random
  k: 1
  n_topology_variants: 2
  elements:
  - branch
  - gen
generation_perturbation:
  type: cost_permutation
  sigma: 1.0
admittance_perturbation:
  type: random_perturbation
  sigma: 0.2
settings:
  num_processes: 32
  data_dir: ./data_out/overnight/opf_large_case500
  large_chunk_size: 150
  overwrite: true
  mode: opf
  include_dc_res: true
  enable_solver_logs: false
  pf_fast: true
  dcpf_fast: true
  max_iter: 200
  seed: 42
